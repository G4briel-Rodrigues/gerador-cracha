<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Crachás GSO</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <script type="module">
        import imglyRemoveBackground from "https://esm.sh/@imgly/background-removal@1.4.5";
        window.imglyRemoveBackground = imglyRemoveBackground;
    </script>
</head>
<body>

    <div class="painel-esquerdo">
        <div class="controles">
            <h2>1. Dados do Crachá</h2>
            <input type="file" id="fotoInput" accept="image/*">
            <input type="text" id="nomeInput" placeholder="NOME DO FUNCIONÁRIO" oninput="renderizarPreview()">
            <input type="text" id="setorInput" placeholder="SETOR" oninput="renderizarPreview()">
            <button onclick="processarFoto()">Carregar e Remover Fundo</button>
            <p id="loadingMsg" style="color: #ffc107; font-size: 13px; display: none;">
                Processando... (A 1ª foto demora uns 15 seg para a IA carregar, guenta aí!)
            </p>
        </div>

        <div class="controles-ajuste">
            <h2>2. Ajustar Foto</h2>
            <label>Zoom da Foto:</label>
            <input type="range" id="zoomInput" min="0.2" max="5" step="0.05" value="1" oninput="renderizarPreview()">
            
            <label>Mover para os Lados (↔):</label>
            <input type="range" id="moveXInput" min="-2000" max="2000" value="0" step="10" oninput="renderizarPreview()">
            
            <label>Mover para Cima/Baixo (↕):</label>
            <input type="range" id="moveYInput" min="-2000" max="2000" value="0" step="10" oninput="renderizarPreview()">
        </div>

        <div class="controles-ajuste">
            <h2>3. Borracha Mágica 🪄</h2>
            <p style="font-size: 12px; margin-top: 0; color: #ccc;">Passe no crachá para arredondar cortes e suavizar os ombros.</p>
            
            <div style="display: flex; gap: 5px; margin-bottom: 15px;">
                <button id="btnErase" onclick="setMode('erase')" style="background-color: #007bff; flex: 1; border: 2px solid white;">Apagar</button>
                <button id="btnRestore" onclick="setMode('restore')" style="background-color: #555; flex: 1; border: none;">Recuperar</button>
            </div>
            
            <label>Tamanho do Pincel: <span id="brushSizeVal">30</span>px</label>
            <input type="range" id="brushSize" min="5" max="100" value="30" oninput="document.getElementById('brushSizeVal').innerText = this.value">
            
            <label>Suavidade (Esfumado): <span id="brushSoftVal">20</span>px</label>
            <input type="range" id="brushSoft" min="0" max="50" value="20" oninput="document.getElementById('brushSoftVal').innerText = this.value">

            <button onclick="limparBorracha()" style="background-color: #dc3545; margin-top: 10px;">Desfazer Borracha</button>
        </div>

        <button class="btn-adicionar" onclick="adicionarNaFolha()">4. Adicionar à Folha A4 ➔</button>
        <hr>
        <button class="btn-exportar" onclick="exportarFolha()">⬇ Exportar Folha em PNG</button>
    </div>

    <div class="area-preview">
        <canvas id="previewCanvas"></canvas>
    </div>

    <div class="area-impressao">
        <div id="folhaA4" class="folha-a4">
            </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
